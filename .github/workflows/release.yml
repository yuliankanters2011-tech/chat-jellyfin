name: Build and publish Jellyfin repository

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: jellyfin-plugin-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      # Rollback release: this deliberately ships v33 until a later change restores a normal source build.
      - name: Restore original version 33 binary with new assembly version
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_CHAT_VERSION: 1.0.0.${{ github.run_number }}
        run: |
          set -euo pipefail
          mkdir -p publish original-v33
          gh release download chat-v1.0.0.33 --repo "$GITHUB_REPOSITORY" --pattern Chat_1.0.0.33.zip --dir original-v33
          echo '5e894682a37ac2af4e4fe9cd5fef8b43  original-v33/Chat_1.0.0.33.zip' | md5sum -c -
          unzip -q original-v33/Chat_1.0.0.33.zip -d original-v33
          python3 -m venv /tmp/chat-assembly-patcher
          /tmp/chat-assembly-patcher/bin/pip install dnfile==0.17.0
          /tmp/chat-assembly-patcher/bin/python scripts/reversion_assembly.py original-v33/Jellyfin.Plugin.Chat.dll publish/Jellyfin.Plugin.Chat.dll "$EXPECTED_CHAT_VERSION"
      - name: Test plugin and metadata
        env:
          EXPECTED_CHAT_VERSION: 1.0.0.${{ github.run_number }}
        run: |
          dotnet run --project tests/ChatWebInjection.Tests/ChatWebInjection.Tests.csproj -c Release
          npm ci --ignore-scripts --no-audit --no-fund
          npm run test:ui
          node --check Web/chat.js
      - name: Install browser for Jellyfin Web test
        run: npx playwright install --with-deps chromium
      - name: Test on Jellyfin 12.4 in Docker
        run: |
          set +e
          bash tests/docker-smoke.sh > smoke-test.log 2>&1
          result=$?
          if [ "$result" -ne 0 ]; then
            python3 -c 'import pathlib; lines=pathlib.Path("smoke-test.log").read_text(errors="replace").splitlines(); chosen=[x for x in lines if "Docker-test mislukt" in x or "Chatprofiel HTTP" in x or "Onverwachte" in x or "Browserdiagnose" in x]; text=" | ".join((chosen + lines[-15:])[-18:]); print("::error::" + text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))'
          else
            cat smoke-test.log
          fi
          exit "$result"
      - name: Package and publish repository
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_NUMBER: ${{ github.run_number }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          version="1.0.0.${RUN_NUMBER}"
          tag="chat-v${version}"
          archive="Chat_${version}.zip"
          (cd publish && zip -j "../${archive}" Jellyfin.Plugin.Chat.dll)
          python3 scripts/create_manifest.py "$archive" "$version" "$REPOSITORY" "$tag" > manifest.json
          # Keep the release invisible until both assets have uploaded successfully.
          gh release create "$tag" --target "$COMMIT_SHA" --draft --title "Chat ${version}" --notes "Jellyfin 12.4 chatplugin. Chat-icoon voor de door Jellyfin gehoste webclient."
          gh release upload "$tag" "$archive" manifest.json
          gh release edit "$tag" --draft=false --latest
